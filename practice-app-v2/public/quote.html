<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote · Trade Desk Lite</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-page="quote">
  <header class="topbar">
    <a class="brand" href="/orders">Trade Desk Lite</a>
    <nav aria-label="Main">
      <a href="/orders">Orders</a>
      <a href="/orders/new" data-role="trader">New order</a>
      <a href="/approvals" data-role="approver">Approvals</a>
      <a href="/orders/import" data-role="trader">Import orders</a>
      <a href="/watchlist">Watchlist</a>
    </nav>
    <div class="user">
      <span id="current-user" data-testid="current-user"></span>
      <button type="button" id="sign-out" class="link">Sign out</button>
    </div>
  </header>
  <main class="card narrow">
    <h1 id="quote-heading">Quote</h1>
    <dl class="details">
      <dt>Last</dt><dd data-field="last"></dd>
      <dt>Bid</dt><dd data-field="bid"></dd>
      <dt>Ask</dt><dd data-field="ask"></dd>
      <dt>As of</dt><dd data-field="asOf"></dd>
    </dl>
    <p id="quote-error" class="error" role="alert" hidden></p>
    <a href="/orders">Back to orders</a>
  </main>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
